name: Build Unison and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Unison 1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/unison"
          curl --fail --location --retry 3 https://github.com/unisonweb/unison/releases/download/release%2F1.3.0/ucm-linux-x64.tar.gz -o "$RUNNER_TEMP/unison.tar.gz"
          tar -xzf "$RUNNER_TEMP/unison.tar.gz" -C "$RUNNER_TEMP/unison"
          echo "$RUNNER_TEMP/unison" >> "$GITHUB_PATH"
      - name: Generate the site with Unison
        run: npm run build
      - name: Verify generated output
        run: npm run check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
